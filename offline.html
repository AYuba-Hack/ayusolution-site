<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070D">
<title>Ayusolution — Sem ligação</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070D;color:#fff;padding:24px}.card{width:min(560px,100%);background:#0D1320;border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:38px;box-shadow:0 24px 80px rgba(0,0,0,.35)}.logo{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.02em;margin-bottom:30px}.mark{width:38px;height:38px;border-radius:11px;background:#2563EB;display:grid;place-items:center;font-size:20px}.pill{display:inline-flex;gap:8px;align-items:center;color:#94A3B8;font-size:13px;margin-bottom:14px}.dot{width:8px;height:8px;border-radius:50%;background:#F59E0B}h1{font-size:clamp(30px,7vw,48px);line-height:1.05;margin:0 0 18px}p{color:#94A3B8;line-height:1.7;margin:0 0 28px}.actions{display:flex;gap:12px;flex-wrap:wrap}a,button{border:0;border-radius:10px;padding:13px 18px;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:#2563EB;color:#fff}.secondary{background:#121826;color:#fff;border:1px solid rgba(255,255,255,.1)}small{display:block;color:#64748B;margin-top:26px}</style>
</head>
<body>
<main class="card">
  <div class="logo"><span class="mark">A</span> AYUSOLUTION</div>
  <div class="pill"><span class="dot"></span> Ligação à internet indisponível</div>
  <h1>Continuamos por aqui.</h1>
  <p>Algumas partes da Ayusolution já ficam disponíveis no dispositivo. Para enviar pedidos, abrir WhatsApp ou carregar conteúdo novo, volte a ligar-se à internet.</p>
  <div class="actions">
    <button class="primary" onclick="location.reload()">Tentar novamente</button>
    <a class="secondary" href="/">Página inicial</a>
  </div>
  <small>Quelimane, Moçambique · Ayusolution</small>
</main>
</body>
</html>
